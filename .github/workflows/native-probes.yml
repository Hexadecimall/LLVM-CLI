name: Run locally cross-built probes

on:
  workflow_dispatch:
    inputs:
      manifest_asset:
        description: Release asset name of the local prebuild validation manifest
        required: true
        type: string
      manifest_sha256:
        description: SHA-256 of the validation manifest
        required: true
        type: string

permissions: {}

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      # Only execute checksummed prebuilds. No source checkout or compilation.
      - name: Verify and execute local prebuilds
        shell: python
        env:
          MANIFEST_ASSET: ${{ inputs.manifest_asset }}
          MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          PROBE_PLATFORM: ${{ matrix.platform }}
        run: |
          import hashlib
          import ctypes
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          from urllib.request import Request, urlopen

          def download(asset, destination, expected, limit):
              if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]*', asset):
                  raise ValueError('invalid asset name')
              repository = os.environ['GITHUB_REPOSITORY']
              url = f'https://github.com/{repository}/releases/download/host-probes-23.1.6/{asset}'
              request = Request(url, headers={
                  'Accept': 'application/octet-stream',
                  'User-Agent': 'LLVM-CLI-native-validation',
              })
              digest = hashlib.sha256()
              size = 0
              with urlopen(request, timeout=60) as response, destination.open('xb') as output:
                  while chunk := response.read(1024 * 1024):
                      size += len(chunk)
                      if size > limit:
                          raise RuntimeError('asset exceeds validation size limit')
                      digest.update(chunk)
                      output.write(chunk)
              if digest.hexdigest() != expected:
                  raise RuntimeError('prebuild checksum mismatch')

          manifest = Path('native-probes.json')
          download(os.environ['MANIFEST_ASSET'], manifest, os.environ['MANIFEST_SHA256'], 65536)
          records = json.loads(manifest.read_text())
          platform = os.environ['PROBE_PLATFORM']
          names = [platform + '-cxx']
          if platform == 'linux':
              names.append('linux-objects')
          if platform + '-llvm' in records:
              names.append(platform + '-llvm')
          for name in names:
              record = records[name]
              executable = Path(name + ('.exe' if platform == 'windows' else '')).absolute()
              download(record['name'], executable, record['sha256'], 512 * 1024**2)
              executable.chmod(0o755)
              environment = dict(os.environ, PATH='')
              if name.endswith('-llvm'):
                  def invoke(arguments):
                      result = subprocess.run([str(executable), *arguments], env=environment,
                                              capture_output=True, text=True, timeout=60)
                      print(result.stdout, result.stderr, flush=True)
                      result.check_returncode()
                      return result.stdout

                  assert '23.1.6' in invoke(['cc', '--version'])
                  assert '23.1.6' in invoke(['nm', '--version'])
                  if 'llvm-as' in invoke(['list']).splitlines():
                      ir = Path('probe.ll')
                      ir.write_text('define i32 @answer() { ret i32 42 }\n')
                      invoke(['as', str(ir), '-o', 'probe.bc'])
                      invoke(['llvm-link', 'probe.bc', '-o', 'linked.bc'])
                      assert 'ret i32 42' in invoke(['dis', 'linked.bc', '-o', '-'])
                  source = Path('hello.c')
                  source.write_text('#include <stdio.h>\nint main(void) { puts("embedded hello"); }\n')
                  output = Path('hello.exe' if platform == 'windows' else 'hello').absolute()
                  target = 'x86_64-windows-gnu' if platform == 'windows' else 'x86_64-linux-gnu'
                  invoke(['cc', '-###', '-compile-target', target, str(source), '-o', str(output)])
                  invoke(['cc', '-compile-target', target, str(source), '-o', str(output)])
                  result = subprocess.run([str(output)], env=environment, text=True,
                                          capture_output=True, timeout=30, check=True)
                  assert result.stdout.strip() == 'embedded hello'
                  cpp = Path('hello.cpp')
                  cpp.write_text('#include <iostream>\nint main() { std::cout << "embedded C++"; }\n')
                  invoke(['c++', '-compile-target', target, str(cpp), '-o', str(output)])
                  result = subprocess.run([str(output)], env=environment, text=True,
                                          capture_output=True, timeout=30, check=True)
                  assert result.stdout == 'embedded C++'
                  library_source = Path('library.c')
                  export = '__declspec(dllexport) ' if platform == 'windows' else ''
                  library_source.write_text(export + 'int answer(void) { return 42; }\n')
                  library = Path('probe.dll' if platform == 'windows' else 'probe.so').absolute()
                  invoke(['cc', '-compile-target', target, '-shared', '-fPIC',
                          str(library_source), '-o', str(library)])
                  assert ctypes.CDLL(str(library)).answer() == 42
                  other_target = 'x86_64-linux-gnu' if platform == 'windows' else 'x86_64-windows-gnu'
                  other_output = Path('hello-cross' if platform == 'windows' else 'hello-cross.exe')
                  invoke(['cc', '-compile-target', other_target, str(source), '-o', str(other_output)])
                  other_magic = b'\x7fELF' if platform == 'windows' else b'MZ'
                  assert other_output.read_bytes().startswith(other_magic)
                  invoke(['cc', '-compile-target', 'aarch64-macos', str(source), '-o', 'hello-macos'])
                  assert Path('hello-macos').read_bytes()[:4] == bytes.fromhex('cffaedfe')
                  invoke(['cc', '-compile-target', 'wasm32-wasi', str(source), '-o', 'hello.wasm'])
                  assert Path('hello.wasm').read_bytes()[:4] == b'\0asm'
                  continue
              result = subprocess.run([str(executable)], env=environment,
                                      capture_output=True, text=True, timeout=60)
              print(name + ': exit ' + str(result.returncode))
              print(result.stdout)
              print(result.stderr)
              markers = (['embedded constructor ran', 'embedded destructor ran', 'object entry returned 42']
                         if name.endswith('objects') else ['constructor', 'host runtime passed', 'destructor'])
              if result.returncode or any(marker not in result.stdout for marker in markers):
                  raise RuntimeError('native execution failed: ' + name)
